<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>❤️</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background:
    radial-gradient(circle at 20% 20%, rgba(92,65,150,.35), transparent 28%),
    radial-gradient(circle at 80% 70%, rgba(30,80,150,.25), transparent 30%),
    linear-gradient(145deg, #020314, #080a2b 55%, #01020d);
  font-family: Tahoma, Arial, sans-serif;
}

.stars {
  position: fixed;
  inset: 0;
  background-image:
    radial-gradient(2px 2px at 10% 20%, white, transparent),
    radial-gradient(1.5px 1.5px at 25% 75%, white, transparent),
    radial-gradient(2px 2px at 45% 30%, white, transparent),
    radial-gradient(1px 1px at 65% 15%, white, transparent),
    radial-gradient(2px 2px at 82% 35%, white, transparent),
    radial-gradient(1.5px 1.5px at 92% 80%, white, transparent),
    radial-gradient(1px 1px at 55% 88%, white, transparent),
    radial-gradient(1.5px 1.5px at 35% 50%, white, transparent);
  opacity: .8;
}

.message {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(.7);
  color: white;
  font-size: clamp(28px, 7vw, 72px);
  font-weight: bold;
  text-shadow:
    0 0 8px #fff,
    0 0 20px #a98cff,
    0 0 45px #6d4aff;
  opacity: 0;
  white-space: nowrap;
  animation: reveal 1.8s ease 3.8s forwards;
}

.comet {
  position: absolute;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: white;
  box-shadow:
    0 0 8px 3px white,
    0 0 20px 8px #b8a4ff,
    0 0 45px 14px rgba(125,100,255,.65);

  left: -80px;
  top: 25%;

  animation: fly 4s cubic-bezier(.15,.65,.35,1) forwards;
}

.comet::before {
  content: "";
  position: absolute;
  right: 5px;
  top: 50%;
  width: 260px;
  height: 5px;
  transform: translateY(-50%);
  background: linear-gradient(
    to left,
    rgba(255,255,255,.95),
    rgba(170,145,255,.45),
    transparent
  );
  filter: blur(2px);
  border-radius: 50%;
}

.comet::after {
  content: "✦";
  position: absolute;
  left: -15px;
  top: -20px;
  color: white;
  font-size: 18px;
  animation: sparkle .7s infinite alternate;
}

.heart {
  position: absolute;
  bottom: 9%;
  left: 50%;
  transform: translateX(-50%);
  color: #f7eaff;
  font-size: 28px;
  opacity: 0;
  animation:
    heartIn 1s ease 5s forwards,
    pulse 1.5s ease-in-out 6s infinite;
}

@keyframes fly {
  0% {
    left: -80px;
    top: 18%;
    transform: rotate(-10deg) scale(.8);
  }

  55% {
    left: 48%;
    top: 48%;
    transform: rotate(-10deg) scale(1.15);
  }

  100% {
    left: 115%;
    top: 76%;
    transform: rotate(-10deg) scale(.75);
  }
}

@keyframes reveal {
  to {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }
}

@keyframes heartIn {
  to {
    opacity: 1;
  }
}

@keyframes pulse {
  50% {
    transform: translateX(-50%) scale(1.2);
  }
}

@keyframes sparkle {
  from {
    opacity: .4;
    transform: scale(.7) rotate(0deg);
  }

  to {
    opacity: 1;
    transform: scale(1.3) rotate(20deg);
  }
}
</style>
</head>

<body>

<div class="stars"></div>

<div class="comet"></div>

<div class="message">
  دوست دارم مامانی ❤️
</div>

<div class="heart">
  ✦ ✧ ✦
</div>

</body>
</html>
