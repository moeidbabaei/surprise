<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>دوست دارم مامانی</title>

<style>
*{
  box-sizing:border-box
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#01030b;
  font-family:Tahoma,Arial,sans-serif
}

.scene{
  position:fixed;
  inset:0;
  background:
    radial-gradient(
      ellipse at 50% 52%,
      rgba(20,85,55,.38),
      transparent 38%
    ),
    linear-gradient(
      180deg,
      #01030c,
      #031a16 58%,
      #010207
    )
}

.v{
  position:absolute;
  inset:-5%;
  box-shadow:inset 0 0 180px 55px #000;
  z-index:20
}

.stars{
  position:absolute;
  inset:0;

  background-image:
    radial-gradient(2px 2px at 8% 18%,#fff,transparent),
    radial-gradient(1px 1px at 18% 42%,#fff,transparent),
    radial-gradient(2px 2px at 27% 12%,#fff,transparent),
    radial-gradient(1px 1px at 34% 70%,#fff,transparent),
    radial-gradient(2px 2px at 47% 26%,#fff,transparent),
    radial-gradient(1px 1px at 55% 78%,#fff,transparent),
    radial-gradient(2px 2px at 68% 17%,#fff,transparent),
    radial-gradient(1px 1px at 74% 55%,#fff,transparent),
    radial-gradient(2px 2px at 88% 27%,#fff,transparent);

  animation:t 3s ease-in-out infinite alternate
}

/* ماه */
.moon{
  position:absolute;
  right:9%;
  top:10%;

  width:85px;
  height:85px;

  border-radius:50%;

  background:
    radial-gradient(
      circle at 35% 35%,
      #fff,
      #eef1ff 40%,
      #bbc5e8 72%,
      #7783a8
    );

  box-shadow:
    0 0 30px #dce6ff,
    0 0 90px #7891ff;

  opacity:.72
}

/* شهاب سبز */
.comet{
  position:absolute;

  left:-120px;
  top:18%;

  width:26px;
  height:26px;

  border-radius:50%;

  background:#39ff14;

  z-index:8;

  box-shadow:
    0 0 5px 2px #39ff14,
    0 0 18px 7px #39ff14,
    0 0 45px 18px #00ff66,
    0 0 90px 35px rgba(0,255,100,.45);

  animation:
    fly 5.2s cubic-bezier(.16,.67,.27,1) forwards
}

/* رد سبز شهاب */
.comet:before{
  content:"";

  position:absolute;

  right:7px;
  top:50%;

  width:470px;
  height:12px;

  transform:translateY(-50%);

  border-radius:100%;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(0,255,80,.15),
      rgba(80,255,140,.7),
      #39ff14
    );

  filter:blur(3px);

  box-shadow:
    0 0 24px #39ff14
}

/* ذرات نور */
.comet:after{
  content:"✦ · ✧ · ✦ ·";

  position:absolute;

  right:80px;
  top:-42px;

  width:360px;

  color:#baffc0;

  letter-spacing:22px;
  font-size:18px;

  opacity:.8;

  animation:
    s .8s ease-in-out infinite alternate
}

/* متن */
.msg{
  position:absolute;

  left:50%;
  top:50%;

  transform:
    translate(-50%,-50%)
    scale(.82);

  color:#fff;

  white-space:nowrap;

  font-size:clamp(28px,7vw,72px);

  font-weight:bold;

  opacity:0;

  z-index:10;

  text-shadow:
    0 0 5px #fff,
    0 0 16px #fff,
    0 0 35px #62ff9a,
    0 0 75px #00ff66;

  animation:
    r 1.7s ease 4.2s forwards,
    g 3s ease-in-out 5.9s infinite
}

/* خط نور زیر متن */
.line{
  position:absolute;

  left:50%;
  top:57%;

  transform:translateX(-50%);

  width:0;
  height:1px;

  background:
    linear-gradient(
      90deg,
      transparent,
      #fff,
      transparent
    );

  box-shadow:
    0 0 15px #62ff9a,
    0 0 35px #00ff66;

  animation:
    l 1.5s ease 5s forwards
}

/* فلش سینمایی */
.flash{
  position:absolute;
  inset:0;

  background:#fff;

  opacity:0;

  z-index:15;

  animation:
    f .35s ease 4.85s
}

/* حرکت شهاب */
@keyframes fly{

  0%{
    left:-120px;
    top:16%;
    transform:rotate(-11deg) scale(.7)
  }

  48%{
    left:45%;
    top:43%;
    transform:rotate(-11deg) scale(1.25)
  }

  100%{
    left:120%;
    top:76%;
    transform:rotate(-11deg) scale(.65)
  }
}

/* ظاهر شدن متن */
@keyframes r{

  0%{
    opacity:0;
    transform:
      translate(-50%,-50%)
      scale(.55);

    filter:blur(12px)
  }

  100%{
    opacity:1;

    transform:
      translate(-50%,-50%)
      scale(1);

    filter:blur(0)
  }
}

/* درخشش متن */
@keyframes g{

  50%{
    text-shadow:
      0 0 8px #fff,
      0 0 22px #fff,
      0 0 50px #62ff9a,
      0 0 100px #00ff66
  }
}

/* خط نور */
@keyframes l{

  to{
    width:min(72vw,700px);
    opacity:.7
  }
}

/* فلش */
@keyframes f{

  35%{
    opacity:.12
  }
}

/* ذرات */
@keyframes s{

  from{
    opacity:.35;
    transform:translateX(0)
  }

  to{
    opacity:1;
    transform:translateX(-18px)
  }
}

/* چشمک ستاره‌ها */
@keyframes t{

  to{
    opacity:.5
  }
}

/* موبایل */
@media(max-width:600px){

  .moon{
    width:60px;
    height:60px
  }

  .comet:before{
    width:300px
  }

  .msg{
    font-size:clamp(25px,8vw,46px)
  }
}
</style>
</head>

<body>

<div class="scene">

  <div class="stars"></div>

  <div class="moon"></div>

  <div class="comet"></div>

  <div class="msg">
    عاشقتم گردنم بگیر مامانی ❤️
  </div>

  <div class="line"></div>

  <div class="flash"></div>

  <div class="v"></div>

</div>

</body>
</html>
